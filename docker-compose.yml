services:
  postgres:
    image: postgres:17-alpine
    container_name: saasforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saasforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saasforge}
      POSTGRES_DB: ${POSTGRES_DB:-saasforge}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-saasforge} -d ${POSTGRES_DB:-saasforge}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: saasforge-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: saasforge-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-saasforge}:${POSTGRES_PASSWORD:-saasforge}@postgres:5432/${POSTGRES_DB:-saasforge}?schema=public
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      API_PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ['sh', '/app/docker/api-entrypoint.sh']
    volumes:
      - ./docker/api-entrypoint.sh:/app/docker/api-entrypoint.sh:ro

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: saasforge-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-saasforge}:${POSTGRES_PASSWORD:-saasforge}@postgres:5432/${POSTGRES_DB:-saasforge}?schema=public
      REDIS_URL: redis://redis:6379
      WORKER_HEALTH_PORT: 3001
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: saasforge-web
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
